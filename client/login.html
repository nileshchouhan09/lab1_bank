<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login - LabBank</title>
  <link rel="stylesheet" href="styles.css"/>
  <script defer src="app.js"></script>
</head>
<body>
<header class="navbar">
  <div class="container nav-flex">
    <h2 class="logo">LabBank</h2>
  </div>
</header>

<div class="auth-container">
  <h2>Net Banking Login</h2>
  <p class="subtitle">Enter your credentials to continue</p>

  <form id="loginForm" class="auth-form" novalidate>
    <label for="loginIdentifier">Customer ID / Email</label>
    <input type="text" id="loginIdentifier" required placeholder="Enter Customer ID or Email" />

    <label for="loginPassword">Password</label>
    <input type="password" id="loginPassword" required placeholder="Enter Password" />

    <button type="submit" class="btn-primary full" id="loginSubmit">Login</button>
    <p id="login-msg" class="msg" aria-live="polite"></p>
  </form>

  <p class="switch-screen">
    New user? <a href="register.html">Create account</a>
  </p>
</div>
</body>
</html>
