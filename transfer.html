<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transfer Funds - LabBank</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="app.js"></script>
</head>

<body>

<header class="navbar">
  <div class="container nav-flex">
    <h2 class="logo">LabBank</h2>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="transfer.html">Transfer Funds</a>
      <a onclick="logout()">Logout</a>
    </nav>
  </div>
</header>

<section>
  <div class="container transfer-box">
    <h2>Transfer Money</h2>

    <form id="transferForm">
      <label>Recipient Account Number</label>
      <input type="text" id="receiverAcc" required placeholder="Enter account number">

      <label>Recipient Name</label>
      <input type="text" id="receiverName" required placeholder="Enter full name">

      <label>Amount (₹)</label>
      <input type="number" id="amount" required placeholder="Enter amount">

      <button type="submit" class="btn-primary full">Send Money</button>
      <p id="transfer-msg" class="msg"></p>
    </form>
  </div>
</section>

<footer>
  <p class="footer-copy">© 2025 LabBank • All Rights Reserved</p>
</footer>

</body>
</html>
