<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Dashboard - LabBank</title>
  <link rel="stylesheet" href="styles.css"/>
  <script defer src="app.js"></script>
</head>
<body>
<header class="navbar">
  <div class="container nav-flex">
    <h2 class="logo">LabBank</h2>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="transfer.html">Transfer Funds</a>
      <a onclick="logout()" style="cursor:pointer;">Logout</a>
    </nav>
  </div>
</header>

<section>
  <div class="container dashboard-layout">
    <aside class="sidebar">
      <h3>Menu</h3>
      <a href="dashboard.html">🏦 Dashboard</a>
      <a href="transfer.html">💸 Transfer Funds</a>
      <a onclick="logout()">🚪 Logout</a>
    </aside>

    <div class="dashboard-content">
      <div class="account-card">
        <h2>Account Summary</h2>
        <p><strong>Account Holder:</strong> <span id="userName">User</span></p>
        <p><strong>Account Number:</strong> 4520 7813 9210</p>
        <p><strong>Balance:</strong> ₹ <span id="balance">0.00</span></p>
      </div>

      <div class="transaction-card">
        <h2>Recent Transactions</h2>
        <table id="txTable">
          <thead><tr><th>Date</th><th>Description</th><th>Amount</th></tr></thead>
          <tbody id="txBody">
            <tr><td colspan="3" style="text-align:center;opacity:0.6;">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>

<footer>
  <p class="footer-copy">© 2025 LabBank • All Rights Reserved</p>
</footer>
</body>
</html>
